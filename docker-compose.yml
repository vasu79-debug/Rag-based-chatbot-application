services:
  browser-sandbox:
    image: ghcr.io/browserless/chromium:latest
    container_name: demo7b-browser-sandbox
    restart: unless-stopped
    ports:
      # Bind to localhost only: an open port 3000 lets anyone on the internet
      # drive this browser. The backend connects via ws://localhost:3000.
      - "127.0.0.1:3000:3000"
    environment:
      # Required token. Set BROWSERLESS_TOKEN in backend/.env (same value) or your shell.
      - TOKEN=${BROWSERLESS_TOKEN:?Set BROWSERLESS_TOKEN (e.g. in .env next to docker-compose.yml)}
      # Browserless v2 kills every session after TIMEOUT ms (default 30000 = 30 s!).
      # CONNECTION_TIMEOUT was the v1 name and is ignored by v2. 30 min here; the
      # backend's own reaper closes idle sessions after 10 min.
      - TIMEOUT=1800000
      - CONCURRENT=10
      - DEFAULT_STEALTH=true
    shm_size: '2gb'
