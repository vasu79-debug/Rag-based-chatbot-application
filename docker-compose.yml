services:
  browser-sandbox:
    image: ghcr.io/browserless/chromium:latest
    container_name: demo7b-browser-sandbox
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - MAX_CONCURRENT_SESSIONS=10
      - CONNECTION_TIMEOUT=60000
      - KEEP_ALIVE=true
      - PREBOOT_CHROME=true
      - DEFAULT_STEALTH=true
    shm_size: '2gb'

